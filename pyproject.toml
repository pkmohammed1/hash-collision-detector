[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "hash-collision-detector"
version = "0.1.0"
description = "Detect files with the same digest but different content"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [{name = "Hash Collision Detector contributors"}]

[project.scripts]
hash-collision-detector = "hash_collision_detector.cli:main"

[tool.setuptools.packages.find]
include = ["hash_collision_detector*"]
